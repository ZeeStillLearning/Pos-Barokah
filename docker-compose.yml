services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pos-barokah-app
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    tty: true

  db:
    image: mysql:8.0
    container_name: pos-barokah-db
    environment:
      MYSQL_DATABASE: pos_barokah
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
